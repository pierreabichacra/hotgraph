# Who gets drawn, and optional seed identities.
#
# Since the bots only alert on wallets YOU added to them, every trader in the
# feed is someone you chose to track — so mode defaults to 'all'.
#
#   all         - draw every trader the bots mention (default)
#   known_only  - draw only people listed below / merged in the UI
#
# Identity is keyed by the trader's FULL wallet address, which every bot embeds
# behind the alert's [wallet]/address link. Handles (@orangie, waddles, vitalik...)
# are display labels. When one person trades from several wallets, link those
# wallets together in the web UI (Merge panel) — or seed them here:
#
# people:
#   - name: "Trader one"
#     color: "#f97316"
#     handles: ["@trader_one"]        # matches alerts with this label
#     wallets:
#       - chain: evm
#         address: "0x..."            # full address
#       - chain: solana
#         address: "..."
#
# UI merges are stored in the database (person_map) and take precedence over
# this file.

mode: all

people: []
